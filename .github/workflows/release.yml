name: Release

# v* 태그를 푸시하면 각 OS의 네이티브 러너에서 패키지를 만들어
# 같은 GitHub Release에 첨부합니다. 빌드 산출물은 러너에서 gh CLI로
# 곧바로 릴리스에 올리며, 워크플로 아티팩트 저장소를 중계로 쓰지 않습니다.
on:
  push:
    tags:
      - "v*"
      - "Agora-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  # 1) 먼저 초안 릴리스를 만들어 세 러너가 올릴 대상을 확정합니다.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "릴리스 $TAG 가 이미 있어 재사용합니다."
          else
            gh release create "$TAG" --draft --title "Agora $TAG" --generate-notes
          fi

  # 2) OS별 네이티브 패키지 빌드 후 초안 릴리스에 직접 업로드.
  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: artifacts/*.exe
          - os: ubuntu-latest
            artifact: artifacts/*.AppImage
          - os: macos-latest
            artifact: artifacts/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows에서도 bash를 써야 업로드 glob이 확장됩니다.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 태그 푸시는 ci.yml의 branches 트리거에 걸리지 않으므로 여기서 한 번 더 돌립니다.
      - run: npm test

      - name: Install Linux runtime deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libasound2는 ubuntu 24.04에서 libasound2t64로 이름이 바뀌었습니다.
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libatk-bridge2.0-0 libdrm2 libgbm1 libxkbcommon0 libasound2t64 \
            || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libatk-bridge2.0-0 libdrm2 libgbm1 libxkbcommon0 libasound2

      - name: Build native package
        env:
          # 서명 인증서가 없으므로 자동 탐색을 꺼서 macOS 빌드가 멈추지 않게 합니다.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      # AppImage는 실행에 FUSE가 필요하므로, 같은 빌드의 linux-unpacked 바이너리로
      # "창이 뜨고 죽지 않는다"만 확인합니다. 펫은 계속 떠 있는 앱이라
      # timeout의 124(제한시간 도달)를 정상으로 봅니다.
      - name: Smoke test Linux build
        if: matrix.os == 'ubuntu-latest'
        run: |
          set +e
          timeout 30s xvfb-run -a artifacts/linux-unpacked/agora --no-sandbox
          status=$?
          set -e
          # 펫은 계속 떠 있는 앱이므로 정상 실행이면 timeout이 30초 뒤 124로 끊습니다.
          # 즉시 종료(0 포함 124 외 모든 코드)는 실행이 바로 죽었다는 뜻이라 실패로 봅니다.
          if [ "$status" -ne 124 ]; then
            echo "linux-unpacked 실행이 exit $status 로 실패했습니다."
            exit 1
          fi
          echo "linux-unpacked 실행 확인됨 (exit $status)"

      - name: Upload package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ${{ matrix.artifact }} --clobber

  # 3) 세 패키지가 모두 붙은 뒤에만 초안을 공개합니다.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false

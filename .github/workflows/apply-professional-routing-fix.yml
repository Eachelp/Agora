name: Apply professional mode routing fix

on:
  push:
    branches:
      - feat/multi-harness-runtime

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage professional routing fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-harness-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact source transforms
        run: node scripts/apply-professional-routing-fix.js
      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/chat/chat-room.js src/chat/chat-ipc.js src/chat-preload.js src/chat.js test/chat-professional-role-routing.test.js
          git diff --cached --check
          git commit -m "fix(chat): isolate professional mode from general replies"
          git push origin HEAD:feat/multi-harness-runtime

name: Apply professional routing log entry

on:
  push:
    branches:
      - feat/multi-harness-runtime

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'trigger-professional-routing-log-update' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-harness-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update evolution log
        run: node scripts/apply-professional-routing-log.js
      - name: Commit and push documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/AGORA_MANAGED_HARNESS_EVOLUTION_LOG.md
          git diff --cached --check
          git commit -m "docs: record professional mode routing regression fix"
          git push origin HEAD:feat/multi-harness-runtime

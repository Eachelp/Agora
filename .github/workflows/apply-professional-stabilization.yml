name: Apply Professional Stabilization

on:
  push:
    branches: [feat/multi-harness-runtime]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feat/multi-harness-runtime, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Repair helper against current HEAD
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/apply-professional-stabilization.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('```', r'\x60{3}')
          s = s.replace('  function roomMeta(meta) {\n    const project = projectForSession(meta);\n    return {\n      permissionMode: meta?.permissionMode || "chat",\n      workspace: meta?.workspace || null,', 'function roomMeta(meta) {\n  const project = projectForSession(meta);\n  const memory = ensureMemoryStore();\n  return {\n    permissionMode: meta?.permissionMode || "chat",\n    workspace: meta?.workspace || null,')
          s = s.replace('  function roomMeta(meta) {\n    const project = projectForSession(meta);\n    return {\n      permissionMode: meta?.permissionMode || "chat",\n      workspace: project?.workspace || null,', 'function roomMeta(meta) {\n  const project = projectForSession(meta);\n  const memory = ensureMemoryStore();\n  return {\n    permissionMode: meta?.permissionMode || "chat",\n    workspace: project?.workspace || null,')
          s = s.replace('      if (workflow && sessionProject && session.meta.workspace && !workflow.readOnly) {\n        workflow.reconcileProjectTasks(sessionProject.id, session.meta.workspace);', '    if (workflow && sessionProject && session.meta.workspace && !workflow.readOnly) {\n      try {\n        workflow.reconcileProjectTasks(sessionProject.id, session.meta.workspace);')
          s = s.replace('      if (workflow && sessionProject?.workspace && !workflow.readOnly) {\n        workflow.reconcileProjectTasks(sessionProject.id, sessionProject.workspace);', '    if (workflow && sessionProject?.workspace && !workflow.readOnly) {\n      try {\n        workflow.reconcileProjectTasks(sessionProject.id, sessionProject.workspace);')
          s = s.replace('      if (permissionMode !== "chat" && !meta.workspace) {\n        return { ok: false, error: "워크스페이스를 먼저 선택해 주세요." };\n      }', '        if (mode !== "chat" && !meta.workspace) {\n          throw new Error("먼저 워크스페이스 폴더를 선택해 주세요.");\n        }')
          s = s.replace('      if (permissionMode !== "chat" && !projectForSession(meta)?.workspace) {\n        return { ok: false, error: "프로젝트 워크스페이스를 먼저 선택해 주세요." };\n      }', '        if (mode !== "chat" && !projectForSession(meta)?.workspace) {\n          throw new Error("프로젝트 워크스페이스를 먼저 선택해 주세요.");\n        }')
          s = s.replace('function buildProfessionalEvidencePayload({ runInfo, builderResult, diff, round, provider } = {}) {', 'function buildProfessionalEvidencePayload({ builderResult = null, diff = null, round = 1, provider = null } = {}) {')
          s = s.replace('function buildProfessionalEvidencePayload({ runInfo, builderResult, diff, round, provider, checkpointProtection = null } = {}) {', 'function buildProfessionalEvidencePayload({ builderResult = null, diff = null, round = 1, provider = null, checkpointProtection = null } = {}) {')
          s = s.replace('    schemaVersion: 2,\n    capturedAt: new Date().toISOString(),', '    schemaVersion: 2,\n    round: round || 1,')
          s = s.replace('    schemaVersion: 3,\n    capturedAt: new Date().toISOString(),\n    checkpointProtection: checkpointProtection || null,', '    schemaVersion: 3,\n    checkpointProtection: checkpointProtection || null,\n    round: round || 1,')
          s = s.replace('      schemaVersion: 2,\n      runId: info.runId,', '        schemaVersion: 2,\n        round: evidence.round || 1,')
          s = s.replace('      schemaVersion: 3,\n      runId: info.runId,\n      checkpointProtection: ["protected", "unavailable_non_git", "unavailable_checkpoint_failed", "unavailable_user_approved"].includes(evidence.checkpointProtection)\n        ? evidence.checkpointProtection\n        : null,', '        schemaVersion: 3,\n        checkpointProtection: ["protected", "unavailable_non_git", "unavailable_checkpoint_failed", "unavailable_user_approved"].includes(evidence.checkpointProtection)\n          ? evidence.checkpointProtection\n          : null,\n        round: evidence.round || 1,')
          # Prompt has evolved since the helper was authored. Patch it separately below.
          s = re.sub(r'// Prompt context assembly uses the same policy it documents\..*?// Specialist: preserve typed freeze error, checkpoint resume flow, evidence enum\.', '// Specialist: preserve typed freeze error, checkpoint resume flow, evidence enum.', s, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Patch role-context prompt assembly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/chat/chat-prompt.js')
          s = p.read_text(encoding='utf-8')
          anchor = 'const { buildConversationWindow } = require("./chat-summary-window");'
          if 'professional-role-context' not in s:
            s = s.replace(anchor, anchor + '\nconst { roleContextPolicy, roleContextPromptLines } = require("./professional-role-context");', 1)
          old = '''  const isBuilder = specialist?.stage === "implementation";
  const isCleanReviewer = specialist?.stage === "review";
  const isPlanReviewer = specialist?.stage === "plan_review";
  const isProfessionalRecorder = specialist?.stage === "recorder" && specialist?.professional === true;
  const isSpecialist = Boolean(specialist);'''
          new = old.replace('  const isSpecialist', '  const rolePolicy = specialist?.stage ? roleContextPolicy(specialist.stage) : null;\n  const isSpecialist')
          if old not in s: raise SystemExit('prompt role variable anchor missing')
          s = s.replace(old, new, 1)
          old = '''  const sourceMessages = isPlanReviewer
    ? messages.filter((message) => message?.authorType === "user")
    : messages;'''
          new = '''  const sourceMessages = rolePolicy?.transcript === "user"
    ? messages.filter((message) => message?.authorType === "user")
    : rolePolicy?.transcript === "none"
      ? []
      : messages;'''
          if old not in s: raise SystemExit('prompt sourceMessages anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('  const recent = isBuilder || isCleanReviewer || isProfessionalRecorder || isSimplify\n    ? []', '  const recent = rolePolicy?.transcript === "none" || isSimplify\n    ? []', 1)
          s = s.replace('  const context = isBuilder || isCleanReviewer || isProfessionalRecorder || isSimplify ? "" : String(projectContext || "").trim();', '  const context = (rolePolicy && !rolePolicy.projectContext) || isSimplify ? "" : String(projectContext || "").trim();', 1)
          s = s.replace('  const workflow = isBuilder || isCleanReviewer || isProfessionalRecorder || isSimplify ? "" : String(workflowContext || "").trim();', '  const workflow = (rolePolicy && !rolePolicy.workflow) || isSimplify ? "" : String(workflowContext || "").trim();', 1)
          s = s.replace('  const memoryFull = isBuilder || isCleanReviewer || isPlanReviewer || isProfessionalRecorder || isSimplify ? "" : String(memoryContext || "").trim();', '  const memoryFull = (rolePolicy && !rolePolicy.memory) || isSimplify ? "" : String(memoryContext || "").trim();', 1)
          marker = '  if (specialist) {\n    const stageLabels = {'
          if marker not in s: raise SystemExit('prompt specialist anchor missing')
          s = s.replace(marker, '  if (specialist) {\n    lines.push(...roleContextPromptLines(specialist.stage));\n    const stageLabels = {', 1)
          marker = '    } else if (specialist.stage === "review") {\n      lines.push("- 대화 transcript와 Builder의 자기보고는 검수 근거로 제공되지 않습니다. 아래 구조화된 사실과 현재 작업공간만 사용하세요.");'
          if marker not in s: raise SystemExit('prompt reviewer anchor missing')
          replacement = marker + '\n      const checkpointProtection = specialist.evidence?.checkpointProtection;\n      if (String(checkpointProtection || "").startsWith("unavailable_")) {\n        lines.push("⚠ 이 실행은 사전 workspace snapshot이 없습니다 (" + checkpointProtection + "). 회귀 검증 신뢰도가 제한됩니다.");\n      }'
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply guarded transform
        run: node scripts/apply-professional-stabilization.js
      - name: Enforce same-author direct simplify
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/chat.js';
          let source = fs.readFileSync(file, 'utf8');
          const before = `    const simplifyTarget = sourceAgent?.available && sourceAgent?.enabled !== false\n      ? sourceAgent\n      : agents.find((entry) => entry.available && entry.enabled !== false) || null;`;
          const after = `    const simplifyTarget = sourceAgent?.available && sourceAgent?.enabled !== false\n      ? sourceAgent\n      : null;`;
          if (!source.includes(before)) throw new Error('direct simplify fallback transform did not match');
          source = source.replace(before, after);
          source = source.replace(`    simplifyBtn.title = simplifyLocked\n      ? "전문 실행 중에는 쉽게 설명을 실행할 수 없습니다"\n      : "이 메시지를 작성한 AI가 같은 모델로 쉽게 풀어 설명합니다";`, `    simplifyBtn.title = simplifyLocked\n      ? "전문 실행 중에는 쉽게 설명을 실행할 수 없습니다"\n      : !simplifyTarget\n        ? "원문을 작성한 AI를 현재 사용할 수 없습니다"\n        : "이 메시지를 작성한 AI가 같은 모델로 쉽게 풀어 설명합니다";`);
          fs.writeFileSync(file, source, 'utf8');
          NODE
      - name: Test transformed tree
        run: npm test
      - name: Remove one-shot helpers
        run: |
          rm -f scripts/apply-professional-stabilization.js
          rm -f .github/workflows/apply-professional-stabilization.yml
      - name: Commit transformed tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(agora): complete professional mode stabilization stages 1-5"
          git push origin HEAD:feat/multi-harness-runtime

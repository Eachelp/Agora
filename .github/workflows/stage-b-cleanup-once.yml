name: One-time Stage B cleanup

on:
  push:
    branches:
      - feat/multi-harness-runtime
    paths:
      - .github/workflows/stage-b-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-harness-runtime
          fetch-depth: 0

      - name: Apply exact cleanup replacements
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, before, after, label) {
            const first = source.indexOf(before);
            const last = source.lastIndexOf(before);
            if (first < 0 || first !== last) {
              throw new Error(`${label}: expected exactly one match`);
            }
            return source.slice(0, first) + after + source.slice(first + before.length);
          }

          const specialistPath = 'src/chat/chat-specialist.js';
          let specialist = fs.readFileSync(specialistPath, 'utf8');

          specialist = replaceOnce(
            specialist,
            'const { describeWorkspaceChanges } = require("../agora/workspace-diff");\n',
            'const { describeWorkspaceChanges } = require("../agora/workspace-diff");\nconst {\n  executionAxes: professionalExecutionAxes,\n  buildProfessionalEvidencePayload,\n} = require("./chat-professional-evidence");\n',
            'specialist evidence import'
          );

          specialist = replaceOnce(
            specialist,
            '  "OUTPUT_LIMITED",\n  "EXECUTION_BLOCKED",',
            '  "OUTPUT_LIMITED",\n  "PROTOCOL_FINAL_MISSING",\n  "EXECUTION_BLOCKED",',
            'protocol final safe reason'
          );

          const oldEvidenceMethods = `  executionAxes({ builderResult = null, diff = null } = {}) {
            const commands = builderResult?.evidence?.commands || [];
            const hasFinished = commands.some((entry) => entry?.kind === "command-finished" || Number.isInteger(entry?.exitCode));
            return {
              transport: builderResult?.transport || "COMPLETED",
              declaration: builderResult?.builderStatus || "MISSING",
              changes: diff?.status || "UNSUPPORTED",
              execution: hasFinished ? "OBSERVED" : commands.length > 0 ? "PARTIAL" : "UNAVAILABLE",
            };
          }

          evidencePayload({ runInfo, builderResult, diff, round, provider }) {
            const axes = this.executionAxes({ builderResult, diff });
            const allCommands = (builderResult?.evidence?.commands || [])
              .filter((entry) => entry?.kind === "command-finished" || Number.isInteger(entry?.exitCode))
              .map((entry) => ({ ...entry }));
            const commands = allCommands.slice(0, 20);
            const payload = {
              schemaVersion: 2,
              round: round || 1,
              invocationId: builderResult?.runId || null,
              provider: provider || null,
              source: { kind: "provider-event", provider: provider || null },
              ...axes,
              sessionPersisted: builderResult?.evidencePersisted !== false,
              commands,
              commandSummary: {
                total: allCommands.length,
                included: commands.length,
                omitted: Math.max(0, allCommands.length - commands.length),
                failed: allCommands.filter((entry) => Number.isInteger(entry.exitCode) && entry.exitCode !== 0).length,
                truncated: allCommands.filter((entry) => entry.truncated).length,
              },
            };
            if (!runInfo || !this.taskManager?.writeRunEvidence) return { ok: true, payload };
            const ok = this.taskManager.writeRunEvidence(runInfo, payload);
            return ok ? { ok: true, payload } : { ok: false, payload };
          }
`;

          const newEvidenceMethods = `  executionAxes(options = {}) {
            return professionalExecutionAxes(options);
          }

          evidencePayload(options = {}) {
            const payload = buildProfessionalEvidencePayload(options);
            const runInfo = options.runInfo || null;
            if (!runInfo || !this.taskManager?.writeRunEvidence) return { ok: true, payload };
            const ok = this.taskManager.writeRunEvidence(runInfo, payload);
            return ok ? { ok: true, payload } : { ok: false, payload };
          }
`;

          specialist = replaceOnce(
            specialist,
            oldEvidenceMethods.replace(/^          /gm, ''),
            newEvidenceMethods.replace(/^          /gm, ''),
            'specialist evidence methods'
          );
          fs.writeFileSync(specialistPath, specialist, 'utf8');

          const roomPath = 'src/chat/chat-room.js';
          let room = fs.readFileSync(roomPath, 'utf8');
          room = replaceOnce(
            room,
            '  installSpecialistMethods,\n  SAFE_BLOCK_REASONS,\n  safeBlockReason,',
            '  installSpecialistMethods,\n  safeBlockReason,',
            'room SAFE_BLOCK_REASONS import'
          );
          room = replaceOnce(
            room,
            'const {\n  executionAxes: professionalExecutionAxes,\n  buildProfessionalEvidencePayload,\n} = require("./chat-professional-evidence");\n',
            '',
            'room evidence import'
          );
          room = replaceOnce(
            room,
            '// Runner가 새로 반환하는 protocol failure를 기존 specialist fail-closed 경로에서도\n// 일반 EXECUTION_BLOCKED로 뭉개지 않고 정확한 원인으로 보존합니다. exported Set은\n// chat-specialist 내부 safeBlockReason()이 참조하는 동일 객체입니다.\nSAFE_BLOCK_REASONS.add("PROTOCOL_FINAL_MISSING");\n\n',
            '',
            'room set mutation'
          );

          const oldOverrides = `

          // Stage B: specialist FSM 자체는 그대로 두고 evidence shaping만 provider-neutral
          // 모듈로 교체합니다. Reviewer와 Run evidence가 같은 payload를 보게 하는 단일 경계입니다.
          ChatRoom.prototype.executionAxes = function executionAxes(options = {}) {
            return professionalExecutionAxes(options);
          };

          ChatRoom.prototype.evidencePayload = function evidencePayload(options = {}) {
            const payload = buildProfessionalEvidencePayload(options);
            const runInfo = options.runInfo || null;
            if (!runInfo || !this.taskManager?.writeRunEvidence) return { ok: true, payload };
            const ok = this.taskManager.writeRunEvidence(runInfo, payload);
            return ok ? { ok: true, payload } : { ok: false, payload };
          };
`;
          room = replaceOnce(
            room,
            oldOverrides.replace(/^          /gm, ''),
            '\n',
            'room evidence overrides'
          );
          fs.writeFileSync(roomPath, room, 'utf8');
          NODE

      - name: Remove one-time workflow
        shell: bash
        run: rm .github/workflows/stage-b-cleanup-once.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/chat/chat-specialist.js src/chat/chat-room.js .github/workflows/stage-b-cleanup-once.yml
          git diff --cached --check
          git commit -m "refactor(chat): centralize professional evidence and block reasons"
          git push origin HEAD:feat/multi-harness-runtime

name: One-time Stage B cleanup

on:
  push:
    branches: [feat/multi-harness-runtime]
    paths: [.github/workflows/stage-b-cleanup-once.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-harness-runtime
          fetch-depth: 0
      - run: node scripts/stage-b-cleanup-once.js
      - run: rm scripts/stage-b-cleanup-once.js .github/workflows/stage-b-cleanup-once.yml
      - run: git diff --check
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add -A
      - run: git commit -m "refactor(chat): centralize professional evidence and block reasons"
      - run: git push origin HEAD:feat/multi-harness-runtime

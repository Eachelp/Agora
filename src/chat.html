<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ἀγορά 채팅</title>
    <link rel="stylesheet" href="./vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="./chat.css" />
  </head>
  <body>
    <div class="titlebar">
      <div class="titlebar-drag">
        <span class="titlebar-logo" aria-hidden="true">Ἀ</span>
        <span class="titlebar-title">Ἀγορά · 채팅</span>
      </div>
      <div class="titlebar-controls">
        <button class="titlebar-btn btn-minimize" id="btn-minimize" type="button" aria-label="최소화">
          <svg viewBox="0 0 10 10"><path d="M 1,5 L 9,5" /></svg>
        </button>
        <button class="titlebar-btn btn-maximize" id="btn-maximize" type="button" aria-label="최대화">
          <svg class="icon-maximize" viewBox="0 0 10 10"><path d="M 2,2 L 8,2 L 8,8 L 2,8 Z" /></svg>
          <svg class="icon-restore" viewBox="0 0 10 10" style="display: none;"><path d="M 2,4 L 6,4 L 6,8 L 2,8 Z M 4,4 L 4,2 L 8,2 L 8,6 L 6,6" /></svg>
        </button>
        <button class="titlebar-btn btn-close" id="btn-close" type="button" aria-label="닫기">
          <svg viewBox="0 0 10 10"><path d="M 2,2 L 8,8 M 8,2 L 2,8" /></svg>
        </button>
      </div>
    </div>

    <div class="app">
      <div class="workspace-shell" id="workspace-shell">
        <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <span class="sidebar-title">프로젝트</span>
          <button class="button button-small" id="btn-new-project" type="button" title="새 프로젝트" aria-label="새 프로젝트">
            <span aria-hidden="true">+</span><span class="new-project-label">프로젝트</span>
          </button>
          <!-- 접기는 사이드바 머리줄 오른쪽 끝에 둔다. 예전에는 사이드바와 대화 사이
               경계선 위에 걸쳐 떠 있어서, 목록 위를 가리고 접으면 창 끝에 반쯤 잘렸다.
               접힌 뒤 다시 펼치는 버튼은 대화 제목 앞(#sidebar-open)에 나타난다. -->
          <button
            class="sidebar-toggle"
            id="sidebar-toggle"
            type="button"
            aria-controls="sidebar"
            aria-expanded="true"
            aria-label="사이드바 접기"
            title="사이드바 접기"
          >
            <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="14" height="12" rx="2.5" />
              <path d="M8 4v12" />
            </svg>
          </button>
        </div>
        <ul class="project-list project-tree" id="project-list" aria-label="프로젝트와 채팅 목록"></ul>
        <!-- 하단은 아이콘 칸·이름 칸·끝 칸이 모든 줄에서 같은 자리에 오는 세로 목록이다.
             진단·재탐지는 문제가 생겼을 때 찾는 버튼이라 메뉴에 숨기지 않고 여기 둔다. -->
        <div class="sidebar-foot">
          <button class="foot-button usage-fold-toggle" id="btn-usage-fold" type="button" aria-expanded="false" aria-controls="btn-usage" title="남은 사용량 접기/펼치기">
            <svg class="foot-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.5 13.5h11" />
              <path d="M4.5 10.5v-3M8 10.5V4M11.5 10.5V6" />
            </svg>
            <span class="foot-label">사용량</span>
            <svg class="usage-fold-chevron" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3.5 10.5 8 6 12.5" />
            </svg>
          </button>
          <button class="usage-strip" id="btn-usage" type="button" hidden title="남은 사용량 자세히 보기" aria-label="남은 사용량 자세히 보기">
            <span class="usage-strip-items" id="usage-strip-items">
              <span class="usage-strip-empty">사용량 확인 중…</span>
            </span>
          </button>
          <div class="foot-row">
            <button class="foot-button" id="btn-doctor" type="button" title="설치와 로그인 상태를 확인합니다">
              <svg class="foot-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1.5 8.5h2.8L6 4l3.2 8 1.6-3.5h3.7" />
              </svg>
              <span class="foot-label">환경 진단</span>
            </button>
            <button class="foot-action" id="btn-refresh-providers" type="button" title="설치된 CLI를 다시 탐지합니다" aria-label="CLI 다시 탐지">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13.2 6.2A5.5 5.5 0 1 0 13.5 9" />
                <path d="M13.5 2.8v3.6H9.9" />
              </svg>
            </button>
          </div>
          <button class="foot-button" id="btn-settings" type="button" title="앱 설정">
            <svg class="foot-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.5 5h6.5M12.5 5h1M2.5 11h1.5M7 11h6.5" />
              <circle cx="10.75" cy="5" r="1.75" />
              <circle cx="5.5" cy="11" r="1.75" />
            </svg>
            <span class="foot-label">설정</span>
          </button>
        </div>
        </aside>
        <div
          class="sidebar-resizer"
          id="sidebar-resizer"
          role="separator"
          aria-label="대화 사이드바 너비 조절"
          aria-orientation="vertical"
          tabindex="0"
        ></div>

      <div class="chat-main">
        <header class="room-bar">
          <div class="room-info">
            <button
              class="sidebar-open"
              id="sidebar-open"
              type="button"
              aria-controls="sidebar"
              aria-expanded="true"
              aria-label="사이드바 펼치기"
              title="사이드바 펼치기"
              hidden
            >
              <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="14" height="12" rx="2.5" />
                <path d="M8 4v12" />
              </svg>
            </button>
            <button class="room-title-button" id="session-title" type="button" title="클릭해서 이름 바꾸기 (F2)">세션</button>
          </div>
          <div class="room-actions">
            <div class="agent-chips" id="agent-chips" aria-label="참여 에이전트"></div>
            <div class="room-controls-actions">
              <button class="chip-button workflow-button" id="btn-workflow" type="button" title="이 프로젝트의 메모리·결정·작업 기록">프로젝트 기록</button>
              <button class="chip-button discussion-button" id="btn-discussion" type="button" title="에이전트 토론 시작">토론 시작</button>
            </div>
          </div>
          <div class="room-controls">
            <div class="room-controls-context">
              <button class="chip-button workspace-button" id="btn-workspace" type="button" title="프로젝트 워크스페이스 폴더">
                <svg class="workspace-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1.8 12.6V3.9c0-.5.4-.9.9-.9h3.1l1.4 1.6h6.1c.5 0 .9.4.9.9v7.1c0 .5-.4.9-.9.9H2.7a.9.9 0 0 1-.9-.9Z" />
                </svg>
                <span id="workspace-label">워크스페이스 없음</span>
              </button>
              <select id="permission-select" aria-label="권한 모드">
                <option value="chat">대화만 (도구 없음)</option>
                <option value="workspace-read">워크스페이스 읽기</option>
                <option value="workspace-write">워크스페이스 쓰기</option>
              </select>
              <span class="enforcement-hint" id="enforcement-hint"></span>
            </div>
          </div>
        </header>

        <div class="store-warning" id="store-warning" hidden></div>

        <main class="chat-scroll" id="chat-scroll">
          <ol class="message-list" id="message-list" aria-live="polite"></ol>
          <div class="typing-row" id="typing-row" hidden></div>
          <div class="typing-row" id="queue-row" hidden aria-live="polite"></div>
        </main>

        <footer class="composer">
          <div class="mention-popup" id="mention-popup" role="listbox" hidden></div>
          <!-- 되질문으로 턴을 끝내 사용자 답을 기다리는 에이전트. 동시 실행 중에도
               누가 나를 기다리는지 여기에 모아 보여, 스크롤에 묻히지 않게 한다. -->
          <div class="awaiting-row" id="awaiting-row" hidden aria-live="polite"></div>
          <div class="attachment-row" id="attachment-row" hidden></div>
          <div class="response-mode-bar" id="response-mode-bar">
            <span class="response-mode-label" id="response-mode-label">@all 응답 방식</span>
            <!-- 둘 중 하나만 고르는 값이라 떨어진 칩 두 개가 아니라 붙은 한 묶음으로 보인다. -->
            <span class="segmented" role="group" aria-labelledby="response-mode-label">
              <button class="mode-chip is-active" id="btn-mode-sequential" type="button" title="이어 발언: 앞선 AI의 답변을 순차적으로 전달하여 참고합니다">이어 발언</button>
              <button class="mode-chip" id="btn-mode-independent" type="button" title="독립 발언: 같은 턴의 다른 AI 답변을 서로 전달하지 않고 독립 응답을 받습니다">독립 발언</button>
            </span>
          </div>
          <div class="composer-box" id="composer-box">
            <button class="icon-button" id="btn-attach" type="button" title="파일 첨부 (이미지·문서, 최대 20MiB)" aria-label="파일 첨부">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m13.2 7.6-5.4 5.4a3.2 3.2 0 0 1-4.6-4.6l5.8-5.8a2.1 2.1 0 0 1 3 3L6.3 11.3a1 1 0 0 1-1.5-1.5l5.1-5.1" />
              </svg>
            </button>
            <textarea
              id="composer-input"
              rows="1"
              placeholder="질문이나 작업을 입력하세요  (@로 대상 지정 · Enter 전송)"
              autocomplete="off"
            ></textarea>
            <button class="button" id="btn-interject" type="button" hidden title="진행 중인 응답과 대기 중인 발언을 모두 멈추고 발언권을 내게 돌립니다. 다음 내 메시지 전까지 AI끼리 서로 부르지 않습니다.">잠깐</button>
            <button class="button button-danger" id="btn-stop" type="button" hidden>중지</button>
            <button class="button button-primary" id="btn-send" type="button">전송</button>
          </div>
        </footer>
        </div>
      </div>
    </div>

    <div class="popover-backdrop" id="popover-backdrop" hidden></div>
    <div class="popover" id="popover" hidden></div>
    <div class="doctor-backdrop" id="doctor-backdrop" hidden>
      <section class="doctor-dialog" role="dialog" aria-modal="true" aria-labelledby="doctor-title">
        <div class="doctor-head">
          <div>
            <h2 id="doctor-title">에이전트 환경 진단</h2>
            <p id="doctor-summary">설치와 로그인 상태를 확인하고 있어요.</p>
          </div>
          <button class="icon-button doctor-close" id="doctor-close" type="button" aria-label="환경 진단 닫기">×</button>
        </div>
        <div class="doctor-list" id="doctor-list" aria-live="polite"></div>
        <div class="doctor-actions">
          <button class="button" id="doctor-refresh" type="button">다시 진단</button>
          <button class="button button-primary" id="doctor-done" type="button">확인</button>
        </div>
      </section>
    </div>
    <div class="approval-backdrop" id="approval-backdrop" hidden>
      <section class="approval-dialog" role="dialog" aria-modal="true" aria-labelledby="approval-title">
        <h2 id="approval-title">도구 실행 권한 요청</h2>
        <p id="approval-summary"></p>
        <pre id="approval-detail"></pre>
        <p class="approval-warning">현재 CLI headless 실행에서는 개별 명령만 승인할 수 없어, 승인하면 이 턴 전체를 자동 승인 모드로 다시 실행합니다.</p>
        <div class="approval-actions">
          <button class="button" id="approval-deny" type="button">거부</button>
          <button class="button button-primary" id="approval-approve" type="button">이 턴 승인 후 다시 실행</button>
        </div>
      </section>
    </div>
    <!-- window.confirm 대신 쓰는 창 안 확인. 네이티브 확인창을 닫은 뒤 입력칸에
         키 입력이 들어가지 않던 문제 때문에 채팅 창의 확인은 모두 여기서 받는다. -->
    <div class="approval-backdrop confirm-backdrop" id="confirm-backdrop" hidden>
      <section class="approval-dialog confirm-dialog" role="alertdialog" aria-modal="true" aria-describedby="confirm-message">
        <p id="confirm-message"></p>
        <div class="approval-actions">
          <button class="button" id="confirm-cancel" type="button">취소</button>
          <button class="button button-primary" id="confirm-ok" type="button">확인</button>
        </div>
      </section>
    </div>

    <!-- KaTeX는 265KB인데 첫 화면에는 필요 없다. defer로 빼 두면 창이 그만큼
         빨리 그려지고, 수식은 renderMathIfAvailable이 준비됐을 때만 그린다. -->
    <script defer src="./vendor/katex/katex.min.js"></script>
    <script defer src="./vendor/katex/auto-render.min.js"></script>
    <script src="./chat-markdown.js"></script>
    <script src="./usage-view.js"></script>
    <script src="./awaiting-view.js"></script>
    <script src="./chat.js"></script>
  </body>
</html>
